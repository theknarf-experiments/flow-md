[package]
name = "flow-md-iwa-launcher"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Launches Chrome with Isolated Web App dev mode enabled and installs the flow-md IWA shell"

[[bin]]
name = "iwa-launcher"
path = "src/main.rs"

# Just the one: editing Chrome's Local State by hand to flip a flag needs a
# real JSON parser, and string-splicing someone else's config is how you
# corrupt a profile.
[dependencies]
serde_json = "1.0.151"

[profile.release]
opt-level = "z"
lto = true
strip = true
