[package]
name = "flow-md-iwa-launcher"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Launches Chrome with Isolated Web App dev mode enabled and installs the flow-md IWA shell"

[[bin]]
name = "iwa-launcher"
path = "src/main.rs"

# Deliberately dependency-free: the launcher is a thin process spawner, and
# zero deps means it builds offline in a couple of seconds.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true
